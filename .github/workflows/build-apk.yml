name: Build Bluug Wallet APK

on:
  push:
    branches:
      - blake2b-fork
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses & Install SDK Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: |
          npm config set allow-git all
          npm install

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/BluugWallet-blake2b-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluugWallet-blake2b-apk
          path: build_output/BluugWallet-blake2b-debug.apk

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/BluugWallet-blake2b-debug.apk
          name: Bluug Wallet BLAKE2b ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
